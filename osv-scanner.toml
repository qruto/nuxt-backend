# What the weekly OSV scan (.github/workflows/weekly.yml) may skip, and why.
#
# Only advisories that have no fixed version inside the ranges our dependencies
# accept, and that reach nothing but build or dev tooling, or need code the
# package never runs (a plugin it never enables): never a consumer's production
# server. Anything with a fix gets fixed in the lockfile instead. SECURITY.md's
# "Open alerts" table gives each the same reason. Every entry expires: when it does, the scan fails
# again and the entry is either removed (fixed upstream) or renewed with a
# fresh look at the paths (`pnpm why <package>`).

# braces <=3.0.3 — no fixed release. Reached only through glob matching at
# build and dev time: micromatch under chokidar-cli (this repo's dev watcher),
# nitropack's globby, @nuxt/content, and vite-plugin-singlefile (the MCP
# inspector build inside @nuxtjs/mcp-toolkit, which the website's Docus
# installs).
[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2027-01-09
reason = "braces 3.0.3: no fixed version; build/dev glob matching only (micromatch via chokidar-cli, nitropack, @nuxt/content, vite-plugin-singlefile)"

