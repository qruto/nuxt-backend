# lychee (https://lychee.cli.rs) finds dead links in the docs, the README and
# the policy files. It runs weekly, never on a pull request — a link breaks
# because a website changed, not because someone's branch did.

# External links only. Links inside the docs are Nuxt Content routes, not paths
# on disk — `/docs/build/data/read-write/search` is `website/content/docs/04.build/5.data/5.search.md` once Docus
# strips the ordering prefixes — so lychee cannot judge them, and the docs build
# already fails on a broken one.
#
# Filtering by scheme is not enough on its own: without a `--root-dir` those
# links fail to resolve before any filter applies, which is why the workflow
# passes one (see weekly.yml).
scheme = ["https", "http"]

# Retry once; a single 5xx from a rate-limited host is not a dead link.
max_retries = 2
timeout = 20
# Some hosts refuse HEAD outright.
method = "get"
# Identify ourselves rather than looking like a scraper.
user_agent = "Mozilla/5.0 (compatible; lychee; +https://github.com/qruto/nuxt-backend)"

exclude_path = [
  "node_modules",
  "dist",
  ".nuxt",
  ".output",
  "CHANGELOG.md",        # generated; its links point at commits and old releases
  ".deepsec",
  ".agents",
  ".claude",
  "pnpm-lock.yaml",
]

exclude = [
  # Loopback and placeholders that appear in documentation examples.
  "^https?://localhost",
  "^https?://127\\.0\\.0\\.1",
  "^https?://0\\.0\\.0\\.0",
  "^https?://example\\.(com|convex\\.cloud)",
  "^https?://.*\\.example\\.com",
  # Anchors into the repository's own not-yet-published pages.
  "^https?://(www\\.)?npmjs\\.com/package/nuxt-backend",
  # Deployment hosts in examples and the playbook.
  "^https?://[a-z0-9-]+\\.convex\\.(site|cloud)",
  # Consistently 403s automated clients while working in a browser.
  "^https?://(www\\.)?linkedin\\.com",
  "^https?://(twitter|x)\\.com",
  # EUR-Lex answers an automated client with 202 and a challenge page, for
  # every law the compliance pages cite. The ELI addresses are permanent
  # identifiers, so a real move is not what this would catch.
  "^https?://eur-lex\\.europa\\.eu/eli/",
  # The German Federal Ministry of Justice's statute site stalls on GitHub's
  # runners now and then: the run of 2026-11-02 timed out on it (20 s, two
  # retries), the run before passed, and a browser gets it at once. lychee
  # has no timeout per host (a `[hosts]` table takes concurrency, interval,
  # headers and accept), and raising `timeout` above would make every dead
  # link slower to report. A section's address (`/bgb/__312k.html`, the
  # cancellation button) is fixed by the statute's name and number.
  "^https?://(www\\.)?gesetze-im-internet\\.de/",
  # GitHub settings pages answer a logged-out client with 404, not 403, so
  # `accept` below cannot cover them (RELEASE.md links the Actions settings).
  "^https?://github\\.com/.*/settings(/|$)",
  # This repository's own files on main: the API reference's "Defined in"
  # links (about 1,400, which TypeDoc writes from this checkout) and the docs'
  # links to the policy files and the examples. Each names a path in the very
  # checkout this job runs on, and test/docs/docs-contract.test.ts fails on a
  # path that does not exist. Asking github.com for them all in one run is
  # what got answered with 503s (issue #96).
  "^https://github\\.com/qruto/nuxt-backend/(blob|tree)/main/",
  # The docs site's own pages (and their Markdown twins). They are the pages
  # under website/content in this checkout, which the same docs test holds
  # every link to, anchor included. The live site trails main until it
  # deploys, and while it is down every link to it would read as dead.
  "^https://nuxt-backend\\.dev/(raw/)?docs(/|$)",
]

# A link that needs a login is not a broken link.
accept = ["200", "204", "206", "403", "429"]
