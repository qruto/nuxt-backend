name: Feature request
description: Suggest a feature or a change to nuxt-backend
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The package is all-in-one by design: every capability ships enabled, with one neutral
        vocabulary (`auth`, `billing`, `email`) over the services underneath. A change to what a
        service itself offers belongs with that service; a change to how this package exposes it
        belongs here.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What the API or behaviour would look like. Alternatives you considered, if any.
    validations:
      required: true
  - type: checkboxes
    id: would-pr
    attributes:
      label: Contribution
      options:
        - label: I can submit a PR for this
