name: CI

# Every check that runs on a commit lives here, so there is one file to read and
# one job (`All checks passed`) that reports them all.
#
# Work is skipped per JOB, never per workflow. A workflow-level `paths:` filter
# stops the whole run, so the required check never reports at all: GitHub shows
# "Expected — waiting for status" forever, with nothing to re-run. A job-level
# `if:` saves the same minutes safely — the run happens, expensive jobs report
# `skipped`, and the aggregate counts `skipped` as a pass.
#
# The pnpm version, the Node runtime and their action pins are defined once, in
# .github/actions/setup.
on:
  push:
    branches:
      - main
  # Every pull request, whatever its base: a stacked pull request targets the
  # branch below it, and each layer is checked on its own before it reaches
  # main. The steps that compare against a base read the pull request's own.
  pull_request:
  # Weekly, and by hand from the Actions tab (say, right before a release): the
  # same checks on main with nothing changed here, so a new Nuxt or Convex
  # release that breaks a fresh app shows up without waiting for a pull
  # request. The consumer smoke tests in `pack` install the newest of each.
  schedule:
    - cron: '41 5 * * 1' # Mondays
  workflow_dispatch:

# Cancel superseded runs on a pull request, never on main. A pull request's
# runs share a group by its number, which no other pull request has (a branch
# name does: two forks can both push `patch-1`). Every other run, a push to
# main, the weekly or a manual one, gets a group of its own: a group holds one
# pending run and a newer one cancels it even without cancel-in-progress, so a
# group shared by main's pushes would let a third merge cancel the second's
# pending run, and `Release` will not tag a commit whose CI run was cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No permissions by default. Each job asks for what it needs.
permissions: {}

# No usage pings from Nuxt, Nitro, Convex or anything honouring the
# console.do-not-track convention — CI is not a user.
env:
  DO_NOT_TRACK: '1'
  NUXT_TELEMETRY_DISABLED: '1'

jobs:
  # Works out which of the expensive jobs a pull request needs. Anywhere else —
  # a push to main, the weekly run, a run by hand — they all run anyway: that
  # costs one full run per merge, and a green main is worth the minutes.
  #
  # No checkout: on a pull request the filter lists the changed files through
  # the API, and nowhere else does it run. `ubuntu-slim` here and on the other
  # jobs that only call an API: the same minutes on a quarter of the machine.
  changes:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      src: ${{ steps.filter.outputs.src }}
      website: ${{ steps.filter.outputs.website }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          # `&shared` / `*shared` is a YAML anchor, and this action resolves
          # it. Paths that both filters need are written once, in one place.
          filters: |
            shared: &shared
              - 'src/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.nuxtrc'
              - 'tsconfig*.json'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            website:
              - *shared
              - 'website/**'
              # The consumer agent skill, which the site serves from ../skills
              # (the static job checks its content on every pull request).
              - 'skills/**'
              # The skill registry llms.txt and the homepage's Markdown list,
              # and the docs walk and frontmatter reader the llms.txt sections
              # are built with.
              - 'src/guidance/skills.ts'
              - 'scripts/lib/docs-pages.mjs'
              - 'scripts/lib/frontmatter.mjs'
              # The scripts the website job runs on its own output.
              - 'scripts/typecheck-website.mjs'
              - 'scripts/check-website-css.mjs'
              - 'scripts/check-website-bundle.mjs'
              - 'scripts/check-website-agents.mjs'
            src:
              - *shared
              # The DevTools panel ships with the package: `build` generates
              # it into dist/devtools-client, which `files` publishes. Leave it
              # out here and a change to the panel skips `pack`, the job that
              # checks the panel has any built assets at all.
              - 'devtools-client-app/**'
              - 'test/**'
              - 'scripts/**'
              - 'examples/**'
              - 'templates/**'
              - 'vitest.config.ts'
              - 'build.config.ts'
              # The ceilings `pack` checks the package against.
              - 'budgets.json'

  # Everything that needs a checkout and an install and nothing more. One job
  # rather than a dozen, because the setup is identical. `if: !cancelled()` on
  # each step means one push reports every problem instead of stopping at the
  # first.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      # The pull request title step reads the current title from the API.
      pull-requests: read
    steps:
      # Records what the job talks to over the network, without blocking it.
      # Only on the jobs that build and run code from the pull request:
      # harden-runner is itself a third-party action, so it is worth adding
      # where there is untrusted code to watch, and nowhere else.
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, because commitlint reads the PR's commit range and
          # `fallow audit` diffs against the PR base.
          fetch-depth: 0
          persist-credentials: false

      # The one job that saves the Linux `node@lts` store, on main.
      - uses: ./.github/actions/setup
        with:
          prepare: lib
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm run lint

      # Type-checks what gets published. The root tsconfig excludes `src/convex`
      # (and the website, which has its own job), so the Convex world —
      # including the published `nuxt-backend/test` entrypoint, which the
      # component build also excludes — needs its own pass.
      - name: Type check
        if: ${{ !cancelled() }}
        run: pnpm run typecheck

      - name: Type check (Convex)
        if: ${{ !cancelled() }}
        run: pnpm run typecheck:convex

      # The typed public subpaths (`nuxt-backend/*`): the `types` vitest
      # project hands test/types/*.test-d.ts to tsc. Here, once, rather than in
      # every leg of the test matrix — types do not depend on the OS.
      - name: Type check (public subpaths)
        if: ${{ !cancelled() }}
        run: pnpm run typecheck:subpaths

      # The DevTools panel ships inside the package (dist/devtools-client) and
      # imports the module's RPC and bridge types directly, so a change on
      # either side is checked against the other. `nuxt typecheck` prepares
      # the panel's own .nuxt first.
      - name: Type check (DevTools panel)
        if: ${{ !cancelled() }}
        run: pnpm run typecheck:devtools-client

      # Conventional Commits, on pull requests only. The local commit-msg hook
      # is faster, but `--no-verify` skips it, so this is the check that holds.
      # Pushes to main are skipped: those commits were checked on their PR.
      - name: Commit messages
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm run lint:commits --from "$BASE_SHA" --to "$HEAD_SHA"

      # The title too: a squash merge writes it as the commit subject on main
      # whenever the pull request has more than one commit, and Release Prepare
      # derives the version bump and the changelog from those subjects. Its own
      # config turns off commitlint's default ignores, which would let a
      # `Revert "…"` or `Merge …` title through.
      #
      # The title is read from the API, not from the event: a re-run replays
      # the original event, so after a title-only edit the payload still holds
      # the old title. The workflow doesn't run on `edited` — CodeRabbit edits
      # every description after its review, and each edit would re-run all of
      # CI — so after editing only the title, re-run this job. The title never
      # reaches the script as an expression, only as the API's output.
      - name: Pull request title
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          title=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .title)
          printf '%s\n' "$title" | pnpm exec commitlint --config commitlint.title.config.js --verbose

      # Compares what package.json promises against what is installed: that our
      # `engines` is not stricter than a dependency's own, and that no peer range
      # is wider than what that peer actually accepts.
      #
      # Nothing else checks this. publint reads the manifest's shape, attw
      # resolves its types, fallow reads the module graph. None of them compares
      # a declared range to reality. This caught a `convex` floor below what
      # the bundled convex-helpers accepts.
      #
      # `--no-workspaces` skips the website and DevTools apps, which are private
      # and promise nobody anything. `-d` skips devDependencies, which are ours
      # alone.
      - name: Manifest ranges (installed-check)
        if: ${{ !cancelled() }}
        run: pnpm run check:manifest

      # The site serves the Panels template under /playground, copied by
      # scripts/sync-panels.mjs; a template change that was not synced into
      # website/ fails here.
      - name: Panels drift
        if: ${{ !cancelled() }}
        run: node scripts/sync-panels.mjs --check

      # Regenerating the TypeDoc reference must produce no diff (and leave no
      # untracked file under the reference tree). A diff means the doc comments
      # in the source and the published reference disagree.
      - name: API reference drift
        if: ${{ !cancelled() }}
        run: pnpm run docs:reference:check

      # The hand-written docs against the code: every module option documented
      # where options are listed, every middleware name a docs page uses
      # registered, README links that resolve from npm, contributor docs that
      # name real CI jobs, nothing describing the repository as it no longer
      # is. Here rather than in `test`, which a docs-only change skips.
      - name: Docs contract
        if: ${{ !cancelled() }}
        run: pnpm run test:docs

      # Security analysis of the workflow files: template injection, credentials
      # left on disk, unpinned actions. Accepted findings live in
      # .github/zizmor.yml.
      #
      # `version` is pinned because it defaults to `latest`, and a new zizmor
      # release can add a rule that fails CI with nothing changed here. Bump it
      # deliberately, and read the new findings then.
      #
      # `inputs` is scoped to .github/ (workflows, the composite action and
      # dependabot.yml): the default walks the whole tree and audits the
      # workflow files third-party skills vendor under .agents/skills/, which
      # are not ours to fix.
      - name: Workflow lint (zizmor)
        if: ${{ !cancelled() }}
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.30.0
          inputs: .github
          advanced-security: false

      # Correctness of the workflow files, which zizmor does not look at: bad
      # expressions, `needs`/matrix references that do not exist, invalid runner
      # labels, malformed cron. It also runs shellcheck over every inline `run:`
      # block (ubuntu-latest ships shellcheck, and actionlint finds it on PATH).
      #
      # Pinned for the same reason as zizmor. It has no config file: nothing
      # needs accepting yet.
      - name: Workflow correctness (actionlint)
        if: ${{ !cancelled() }}
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12
          fail-on-error: true

      # Misspellings in prose, comments, identifiers and workflow files.
      # Settings and the accepted-word list are in _typos.toml, including the
      # `.git/` exclusion — without it, the `fetch-depth: 0` above makes typos
      # report on old commit subjects.
      - name: Spelling (typos)
        if: ${{ !cancelled() }}
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

      # Dead code, unused exports and dependencies, duplication, complexity,
      # through the lockfile's CLI: the version package.json pins, the same
      # commands as .githooks. Its npm wrapper verifies the binary's signature
      # before running it and refuses on any failure, which is what the fallow
      # action added, along with a nested cache that idled longer than the
      # analysis ran.
      #
      # On a pull request it looks only at the files changed since the base,
      # and fails on any finding in them (`audit.gate` in .fallowrc.jsonc): a
      # finding fallow counts as inherited still fails the run over everything
      # on main, so letting it through here only moves the failure there.
      # Anywhere else it runs over everything, because a scoped audit passes
      # on a config edit that strands a file elsewhere.
      #
      # Must run after the setup step's `dev:prepare`: without `dist/` the
      # tsconfig chain does not resolve and fallow sees a different module
      # graph.
      - name: Quality (fallow)
        if: ${{ !cancelled() }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            pnpm exec fallow audit --base "$BASE_SHA"
          else
            pnpm run test:quality
          fi

      # A separate command, because fallow keeps security candidates out of
      # both the default run and the audit gate, so neither would ever report
      # one. Over every file, so a candidate in an untouched one still fails.
      - name: Security candidates (fallow)
        if: ${{ !cancelled() }}
        run: pnpm run test:security

  test:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.src == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix because the module does real path work (the
        # scaffold writes files, the codegen watcher normalizes paths) — the
        # class of bug that only ships to Windows users.
        #
        # Two Node versions without a third leg: Linux runs the floor
        # `engines.node` promises (read from package.json, so raising it needs
        # no edit here), Windows the current LTS line (`lts` tracks it without
        # a bump). Every other job runs `node@lts` on Linux.
        include:
          - os: ubuntu-latest
            node: engines
          - os: windows-latest
            node: lts
    steps:
      # On the Windows leg too: the action supports every GitHub-hosted image,
      # and `audit` blocks nothing on any of them.
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the Node floor
        id: floor
        if: matrix.node == 'engines'
        run: |
          floor=$(jq -r '.engines.node | ltrimstr(">=")' package.json)
          if ! [[ $floor =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::engines.node is not a plain '>=x.y.z' floor; teach this step to read it."
            exit 1
          fi
          echo "runtime=node@$floor" >> "$GITHUB_OUTPUT"

      # `lib`: the `nuxt` vitest project boots a Nuxt app from the repository
      # root, not from the website, so nothing here needs `nuxt prepare website`.
      # Each leg saves its own store on main: the runtimes differ, and so do
      # the cache keys.
      - uses: ./.github/actions/setup
        with:
          runtime: ${{ steps.floor.outputs.runtime || format('node@{0}', matrix.node) }}
          prepare: lib
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      # `pnpm test` without the projects `static` already runs once (`docs`,
      # `types`): their results do not depend on the OS or the Node version.
      # Coverage, and the thresholds in vitest.config.ts with it, on Linux
      # only: instrumenting the Windows run would measure the same lines again,
      # slower.
      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            pnpm run test:coverage
          else
            pnpm exec vitest --run --project '!e2e' --project '!docs' --project '!types'
          fi

      # Handed to the `coverage` job, which holds the upload credential. This
      # job runs code from the pull request, so it must never hold one itself.
      - name: Upload coverage artifact
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage/
            test-report.junit.xml
          retention-days: 1
          if-no-files-found: error

      # Full-app end-to-end, on the Linux leg rather than a job of its own,
      # which would pay a second checkout, install and prepare: builds
      # `templates/starter` and `templates/panels` with @nuxt/test-utils/e2e
      # and serves them on a real Nitro server against a stub deployment (SSR
      # pages, the auth middleware's redirect, the Convex-aware CSP), with a
      # browser leg for the sign-in form and a live query, and a screenshot of
      # every module page. The other apps are installed and built in `pack`.
      #
      # The browser the e2e project drives. playwright-core is the lockfile
      # version, so the browser build it downloads is the one it was tested
      # against; `--with-deps` adds the runner's system libraries. Only the
      # headless shell: @nuxt/test-utils launches headless with no `channel`,
      # so the full Chrome download would go unused.
      - name: Install Chromium
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: pnpm exec playwright-core install --with-deps --only-shell chromium

      - name: End-to-end tests
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: pnpm run test:e2e

      # Every page the module mounts, at 390 and 1280 px in both schemes, from
      # test/e2e/screenshots.test.ts: compare a pull request's set with main's
      # to see what a change does to the packaged pages.
      - name: Upload module-page screenshots
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: module-page-screenshots
          path: .qa/module-pages/
          retention-days: 14
          if-no-files-found: warn

  # Checks the package a consumer would actually get. Builds the real tarball
  # (`pnpm pack` rewrites `catalog:` ranges exactly like `pnpm publish` does),
  # checks its shape, then installs it into the template and the examples with
  # plain npm and pnpm, and once more into a blank app with strict pnpm. That last part — a registry-style install,
  # lifecycle scripts, engines, an isolated node_modules — is what no other job
  # here exercises.
  pack:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.src == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          prepare: lib

      # Runs `prepack` (the full build) and produces the exact artifact a release
      # would publish.
      - name: Pack
        run: pnpm pack

      # publint, attw, the content rules and the phantom-dependency walk.
      # Defined once in scripts/check-tarball.mjs, and release.yml's build job
      # runs the same script.
      - name: Check the tarball
        if: ${{ !cancelled() }}
        run: pnpm run check:tarball

      # Every consumer install, side by side: each app in its own directory,
      # as a background job with its own log and port, and the step names any
      # app that failed. They share nothing but the npm cache and the pnpm
      # store, both safe to use at once. Convex codegen runs a local backend,
      # so the codegens take turns (`flock`).
      #
      # npm: no lockfile, on purpose, because this is what a new user gets.
      # `npm` is pinned rather than pnpm's: pnpm's Node runtime ships without
      # npm and npx from pnpm 11 on, and a stock npm is exactly the path being
      # tested. The image's own npm (10.9.x) crashes while resolving peers on
      # any Nuxt 4 tree (`Cannot read properties of null (reading
      # 'edgesOut')`, npm/cli#9787, fixed in 11.6.0); the pin also keeps the
      # job reproducible when the runner image moves.
      #
      # The template and the examples are standalone apps of the published
      # package (`nuxt-backend: latest`); installing the tarball over that
      # dependency is exactly what a user who creates one with `create nuxt`
      # gets, minus the registry. Each built app is then started and asked for
      # `/login`, the module's own page, which every app mounts and which
      # renders although nothing answers at the placeholder backend URL. A
      # build can succeed and still not serve: Nuxt 4.6's production build
      # left the Convex client with an import pointing outside `.output`, so
      # every request failed with ERR_MODULE_NOT_FOUND while `nuxt build`
      # passed. No lockfile means the newest Nuxt, so this is where a new Nuxt
      # release meets the package first.
      #
      # `floors`: the starter once more, at the lowest versions this package
      # declares: the Nuxt floor in `meta.compatibility` and the floors of the
      # convex and vue peer ranges. The newest of each proves the top of each
      # range; this keeps the bottom honest. If it fails, the floor has moved:
      # raise it in src/module.ts or package.json (and STABILITY.md) rather
      # than working around it here.
      #
      # `pnpm`: the template and the examples under pnpm's defaults, with only
      # what each one carries: its `.pnpmfile.mjs` answers the dependency build
      # scripts (pnpm 11 stops the first install until every one is answered,
      # here declined) and hoists `@convex-dev/*` so Convex's bundler reaches
      # the component definitions the scaffold imports. A template can't ship
      # a pnpm-workspace.yaml (`create nuxt` treats one that has it as
      # pnpm-only), so the codegen assertion is what proves the hook works,
      # and that Convex bundles without esbuild's install script. Then the
      # official modules `create nuxt` offers, whose build scripts the hook
      # answers too.
      #
      # `strict-pnpm`: a blank app under pnpm's default isolated linker, which
      # hides everything a package does not declare: the one layout the
      # hoisted workspace here, and npm, can never fail on. It installs the
      # tarball with the settings the installation docs give strict-pnpm users
      # (the `@convex-dev/*` hoist) and runs the same codegen assertion.
      #
      # Both pnpm apps zero `minimumReleaseAge` for their throwaway installs
      # only: the gate must not depend on how many hours ago a dependency was
      # published.
      - name: Consumer smoke tests (npm and pnpm)
        id: smoke
        if: ${{ !cancelled() }}
        env:
          NUXT_PUBLIC_BACKEND_URL: https://example.convex.cloud
          CONVEX_AGENT_MODE: anonymous
        run: | # zizmor: ignore[adhoc-packages]
          TARBALL="$PWD/$(ls nuxt-backend-*.tgz)"
          CODEGEN="$GITHUB_WORKSPACE/scripts/ci-convex-codegen.sh"
          npm() { npx --yes npm@11.17.0 "$@"; }
          codegen() { flock "$RUNNER_TEMP/codegen.lock" "$CODEGEN"; }

          # Copies an app without what a previous run left in it.
          fresh() {
            cp -R "$1" "$2"
            rm -rf "$2/node_modules" "$2/.nuxt" "$2/.output"
          }

          serve() {
            local port=$1 server code
            PORT=$port node .output/server/index.mjs > server.log 2>&1 &
            server=$!
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 --retry 30 --retry-max-time 120 --retry-connrefused --retry-delay 1 "http://localhost:$port/login" || true)
            kill "$server" 2> /dev/null || true
            wait "$server" || true
            if [ "$code" != 200 ] || grep -q 'Cannot find module' server.log; then
              echo "::error::The built $(basename "$PWD") answered HTTP $code for /login"
              cat server.log
              return 1
            fi
          }

          smoke_npm() {
            local app=$1 port=$2 dir build_codegen=true
            dir="$RUNNER_TEMP/smoke-$(basename "$app")"
            fresh "$app" "$dir"
            # Codegen goes unless the app commits it. An app whose pages
            # import `#backend/api` gets it again from the installed package
            # before the build, as a user's build always has it (`convex dev`
            # writes it, `convex deploy` before its `--cmd`); the others prove
            # they build without it.
            if ! git ls-files --error-unmatch "$app/backend/_generated/api.d.ts" > /dev/null 2>&1; then
              rm -rf "$dir/backend/_generated"
              if grep -rq '#backend/api' "$app/app"; then build_codegen=codegen; fi
            fi
            cd "$dir" \
              && npm install --no-audit --no-fund "$TARBALL" \
              && "$build_codegen" \
              && npm run build \
              && serve "$port"
          }

          smoke_floors() {
            local dir="$RUNNER_TEMP/smoke-floors"
            fresh templates/starter "$dir"
            rm -rf "$dir/backend/_generated"
            node -e '
              const fs = require("node:fs")
              const floor = range => range.match(/\d+\.\d+\.\d+/)[0]
              const peers = JSON.parse(fs.readFileSync("package.json", "utf8")).peerDependencies
              const nuxt = fs.readFileSync("src/module.ts", "utf8").match(/compatibility: \{ nuxt: .(.+?). \}/)[1]
              const pins = { nuxt: floor(nuxt), convex: floor(peers.convex), vue: floor(peers.vue) }
              const file = process.argv[1]
              const app = JSON.parse(fs.readFileSync(file, "utf8"))
              app.dependencies = { ...app.dependencies, ...pins }
              app.overrides = { ...app.overrides, ...pins }
              fs.writeFileSync(file, JSON.stringify(app, null, 2))
              console.log("floors:", JSON.stringify(pins))
            ' "$dir/package.json" \
              && cd "$dir" \
              && npm install --no-audit --no-fund "$TARBALL" \
              && codegen \
              && npm run build \
              && serve 3003
          }

          smoke_pnpm() {
            local app dir
            export pnpm_config_minimum_release_age=0
            for app in templates/starter templates/panels examples/advanced; do
              dir="$RUNNER_TEMP/smoke-pnpm-$(basename "$app")"
              fresh "$app" "$dir"
              # Codegen goes unless the app commits it.
              git ls-files --error-unmatch "$app/backend/_generated/api.d.ts" > /dev/null 2>&1 || rm -rf "$dir/backend/_generated"
              (cd "$dir" && pnpm add "$TARBALL") || return 1
            done
            cd "$RUNNER_TEMP/smoke-pnpm-starter" \
              && codegen \
              && pnpm add @nuxt/a11y @nuxt/content @nuxt/eslint @nuxt/fonts @nuxt/hints \
                @nuxt/icon @nuxt/image @nuxt/scripts @nuxt/test-utils @nuxt/ui better-sqlite3
          }

          smoke_strict_pnpm() {
            local dir="$RUNNER_TEMP/smoke-strict-pnpm"
            mkdir -p "$dir/app" && cd "$dir" || return 1
            printf '%s\n' '{ "name": "smoke-strict-pnpm", "private": true, "type": "module" }' > package.json
            printf '%s\n' "export default defineNuxtConfig({ modules: ['nuxt-backend'], telemetry: false })" > nuxt.config.ts
            printf '%s\n' '<template><div>smoke</div></template>' > app/app.vue
            printf '%s\n' 'publicHoistPattern:' "  - '@convex-dev/*'" 'allowBuilds:' '  esbuild: false' 'minimumReleaseAge: 0' > pnpm-workspace.yaml
            pnpm add nuxt convex "$TARBALL" \
              && pnpm exec nuxt-backend init \
              && pnpm install --no-frozen-lockfile \
              && pnpm exec nuxt build \
              && codegen
            # `init` adds the MCP server's SDK to devDependencies and says to
            # install; in CI pnpm's lockfile is frozen by default, and its
            # check before `pnpm exec` would refuse the changed manifest.
          }

          # Fetch the pinned npm once, before four jobs race to.
          npm --version > /dev/null

          names=() pids=()
          start() {
            names+=("$1")
            (set -o pipefail; "${@:2}") > "$RUNNER_TEMP/smoke-$1.log" 2>&1 &
            pids+=("$!")
          }
          start starter smoke_npm templates/starter 3000
          start panels smoke_npm templates/panels 3001
          start advanced smoke_npm examples/advanced 3002
          start floors smoke_floors
          start pnpm smoke_pnpm
          start strict-pnpm smoke_strict_pnpm

          failed=''
          for i in "${!names[@]}"; do
            wait "${pids[i]}" || failed="$failed ${names[i]}"
            echo "::group::${names[i]}"
            cat "$RUNNER_TEMP/smoke-${names[i]}.log"
            echo '::endgroup::'
          done
          if [ -n "$failed" ]; then
            echo "::error::Consumer smoke tests failed:$failed"
            exit 1
          fi

      # The install and starter budgets in budgets.json: what installing the
      # tarball adds to an empty project, and the JavaScript every page of the
      # starter loads before it runs, read from the starter the step above
      # built. Both install from the registry with no lockfile, so a release
      # upstream can move them: on a pull request going over warns, on main
      # and in the weekly run it fails. (The tarball budget, in the check
      # above, always fails.) scripts/budgets.mjs says how each is measured;
      # a change that grows one on purpose moves it with
      # `pnpm budgets:update install starter`.
      - name: Check the install and starter budgets
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        env:
          BUDGETS_MODE: ${{ github.event_name == 'pull_request' && 'warn' || 'fail' }}
        run: pnpm run check:budgets --starter "$RUNNER_TEMP/smoke-starter"

      # The other product of this package: the Convex component. A consumer's
      # `convex dev` resolves `nuxt-backend/convex.config` from the
      # scaffolded config, bundles the component and generates
      # `components.backend.*` typed against
      # `nuxt-backend/_generated/component.js` — the exports map has
      # to make both reachable, and only a real codegen from an installed copy
      # proves it. How codegen runs without a deployment, and what it checks:
      # scripts/ci-convex-codegen.sh.
      - name: Consumer codegen (Convex component from the tarball)
        if: ${{ !cancelled() }}
        working-directory: ${{ runner.temp }}/smoke-starter
        run: |
          "$GITHUB_WORKSPACE/scripts/ci-convex-codegen.sh"

      # nuxt-backend/test-utils as an app uses it: the Testing page's Vitest
      # setup and worked example (test/fixtures/test-utils) in a fresh copy of
      # the starter, installed in one go with the tarball and the test tools
      # at the ranges this repository tests with. Adding the tools onto the
      # tree the smoke step installed crashes npm's arborist, so this app
      # gets its own install. The aliases have to reach the installed package
      # through the app's own Nuxt environment, which no test in the
      # repository can show. `--before` holds npm to pnpm-workspace.yaml's
      # release cooldown, as the repository's own installs are. npm has no
      # counterpart to `minimumReleaseAgeExclude`, and an override under
      # `--before` crashes its arborist, so when one of the package's own
      # dependencies on that list (our stack: nuxt-convex-module, Convex
      # components) is newer than the cutoff, the cutoff moves to just past
      # its release. That loosens the cooldown for everything else by the same
      # stretch, never by more than the cooldown itself.
      - name: Consumer component tests (nuxt-backend/test-utils)
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        env:
          NUXT_PUBLIC_BACKEND_URL: https://example.convex.cloud
        run: | # zizmor: ignore[adhoc-packages]
          TARBALL="$PWD/$(ls nuxt-backend-*.tgz)"
          APP="$RUNNER_TEMP/smoke-test-utils"
          cp -R templates/starter "$APP"
          rm -rf "$APP/node_modules" "$APP/.nuxt" "$APP/.output" "$APP/backend/_generated"
          AGE=$(sed -n 's/^minimumReleaseAge: *//p' pnpm-workspace.yaml)
          BEFORE=$(node -e '
            const fs = require("node:fs")
            const own = JSON.parse(fs.readFileSync("package.json", "utf8"))
            const file = process.argv[1]
            const app = JSON.parse(fs.readFileSync(file, "utf8"))
            const tools = ["vitest", "@nuxt/test-utils", "@vue/test-utils", "happy-dom", "axe-core"]
            app.devDependencies = Object.fromEntries(tools.map(name => [name, own.devDependencies[name]]))
            fs.writeFileSync(file, JSON.stringify(app, null, 2))
            const workspace = fs.readFileSync("pnpm-workspace.yaml", "utf8")
            const exempt = workspace.match(/^minimumReleaseAgeExclude:\n((?:\s+- .+\n)+)/m)[1].split("\n").filter(Boolean)
              .map(line => new RegExp("^" + line.replace(/^\s+- /, "").replace(/["\x27]/g, "").replace(/\*/g, ".*") + "$"))
            const cutoff = Date.now() - Number(process.argv[2]) * 60_000
            const releases = Object.keys(own.dependencies).filter(name => exempt.some(pattern => pattern.test(name))).map(async name => {
              const { version } = JSON.parse(fs.readFileSync("node_modules/" + name + "/package.json", "utf8"))
              const { time } = await (await fetch("https://registry.npmjs.org/" + name)).json()
              const released = Date.parse(time[version])
              if (released > cutoff) console.error(name + "@" + version + " is exempt from the cooldown: the cutoff moves past it")
              return released
            })
            Promise.all(releases).then(times => console.log(new Date(Math.max(cutoff, ...times.map(t => t + 1000))).toISOString()))
          ' "$APP/package.json" "$AGE")
          cp -R test/fixtures/test-utils/. "$APP"
          cd "$APP"
          npx --yes npm@11.17.0 install --no-audit --no-fund --before "$BEFORE" "$TARBALL"
          npx vitest run

      # The Panels template's own tests, as the tutorial's part 6 runs them: its
      # backend functions on nuxt-backend/test and a page over the mock
      # backend, in the copy the smoke step installed with the tarball and the
      # template's devDependencies. The functions need their codegen first.
      - name: Panels template tests
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        working-directory: ${{ runner.temp }}/smoke-panels
        env:
          NUXT_PUBLIC_BACKEND_URL: https://example.convex.cloud
        run: |
          "$GITHUB_WORKSPACE/scripts/ci-convex-codegen.sh"
          npx vitest run

      # The steps above prove the tarball installs, builds and codegens. This
      # one proves its type declarations compile inside an app — the Nuxt half
      # (pages, composables) and the Convex half (the scaffolded functions
      # against `components.backend.*`). `vue-tsc` checks the sources and `attw`
      # checks that the types resolve; neither answers this, and this package's
      # product is its types.
      - name: Consumer type check (built package)
        if: ${{ !cancelled() }}
        run: pnpm run check:consumer-types "$RUNNER_TEMP/smoke-starter"

      # Checks the registry signature and provenance of every dependency the
      # install above pulled in. pnpm's `trustPolicy: no-downgrade` refuses a
      # package whose evidence gets weaker between versions; this checks that
      # the evidence is valid at all, on the npm path a consumer uses.
      #
      # unimport@7.0.2, which Nuxt 4.6 pulls in, lists an attestation the
      # registry answers with 404, and `npm audit signatures` stops at the first
      # 404 — nothing after it would be checked. Until npm serves it
      # (unjs/unimport#568) each app pins 7.0.1 for this check; any answer but
      # 200, a network failure included, keeps the pin.
      - name: Verify dependency signatures
        if: ${{ !cancelled() }}
        run: | # zizmor: ignore[adhoc-packages]
          attested=$(curl -s -o /dev/null -w '%{http_code}' https://registry.npmjs.org/-/npm/v1/attestations/unimport@7.0.2 || true)
          if [ "$attested" = 200 ]; then
            echo "::warning::npm now serves unimport@7.0.2's attestation — remove the pin in this step (unjs/unimport#568)."
          fi
          for app in starter panels advanced test-utils; do
            (
              cd "$RUNNER_TEMP/smoke-$app"
              if [ "$attested" != 200 ]; then
                node -e "const fs = require('fs'); const p = JSON.parse(fs.readFileSync('package.json')); p.overrides = { ...p.overrides, 'unimport@7.0.2': '7.0.1' }; fs.writeFileSync('package.json', JSON.stringify(p, null, 2))"
                npx --yes npm@11.17.0 install --no-audit --no-fund
              fi
              npx --yes npm@11.17.0 audit signatures
            )
          done

  # The docs site + playground: type-checked and built the way a deploy builds
  # it. `full` prepare, because both read website/.nuxt.
  website:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.website == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          prepare: full

      # `website/backend/_generated` is Convex codegen, committed so a Vercel
      # build needs no deployment. It must regenerate identically
      # (scripts/ci-convex-codegen.sh: an anonymous local deployment, the typed
      # output, no diff against the committed files).
      - name: Convex codegen (anonymous local deployment)
        working-directory: website
        run: |
          "$GITHUB_WORKSPACE/scripts/ci-convex-codegen.sh" --committed

      # The packaged component's own `_generated/` (its ComponentApi, server
      # builders and data model) is committed and compiled into the tarball —
      # it is what a consumer's codegen types `components.backend.*` against.
      # Nothing regenerates it but the dev watcher, so a function-signature
      # change committed without it would publish a stale ComponentApi.
      # Component codegen needs a selected deployment; the anonymous local one
      # the step above provisioned in this directory is reused, with the
      # repository's own convex CLI (the generated file changes shape between
      # CLI versions).
      - name: Component codegen drift
        if: ${{ !cancelled() }}
        working-directory: website
        env:
          CONVEX_AGENT_MODE: anonymous
        run: |
          pnpm exec convex codegen --component-dir ../src/convex/components/backend
          git diff --exit-code -- ../src/convex/components/backend/_generated

      # vue-tsc over the website, with diagnostics from upstream layer sources
      # (Docus ships app code that type-checks against its own peer set)
      # filtered out — see the script.
      - name: Type check (website)
        if: ${{ !cancelled() }}
        run: node scripts/typecheck-website.mjs

      # One production build, prerendering the docs, in the shape
      # nuxt-backend.dev serves, and every check below reads it: a Vercel
      # build, with Vercel's analytics modules, the docs assistant (on with the
      # deployment's OIDC token) and the error-reporting SDK the monitoring
      # layer wires once a build sees a DSN. The SDK, with the debug IDs its
      # build plugin writes into every chunk, weighs some 48 kB of the heaviest
      # page's initial JavaScript, so a build without it would hold the bundle
      # ceiling to a site nobody serves. `node-server` rather than Vercel's
      # output, so the agent-surfaces check can serve `.output`.
      #
      # The URLs, the token and the DSN are stand-ins: the build only needs
      # them well-formed, nothing serves this build, no Sentry token means
      # nothing uploads, the SDK's build plugin sends no telemetry
      # (website/nuxt.config.ts), and the playground routes that would open a
      # live connection are excluded from prerendering. The nuxt binary, not
      # `pnpm exec`: with VERCEL set, pnpm's check before a run can read a
      # changed setting and ask for a fresh install.
      - name: Build (website, production shape)
        if: ${{ !cancelled() }}
        env: &production-shape
          NUXT_PUBLIC_BACKEND_URL: https://example.convex.cloud
          NUXT_SITE_URL: https://nuxt-backend.example
          VERCEL: '1'
          VERCEL_ENV: production
          VERCEL_OIDC_TOKEN: ci-placeholder
          NITRO_PRESET: node-server
          MONITORING_DSN: https://public@o0.ingest.sentry.io/0
        run: ./node_modules/.bin/nuxt build website

      # The build succeeds even when the site's palette silently falls back to
      # stock Tailwind; this reads the built CSS and fails if it did.
      - name: Check website CSS
        if: ${{ !cancelled() }}
        run: node scripts/check-website-css.mjs

      # The docs and the home page defer the backend client to the blocks
      # that use it (website/modules/deferred-backend-client); this reads
      # each prerendered page's initial scripts and fails when they reach it
      # again, or grow past the ceiling. It also holds the live demos to the
      # `demo: true` pages, and what a demo loads once it starts to its own
      # ceiling.
      - name: Check website bundle
        if: ${{ !cancelled() }}
        run: node scripts/check-website-bundle.mjs

      # What the site serves agents (website/shared/agent-surfaces.ts),
      # against this build: it serves .output and asks for llms.txt and every
      # link on it (each twin opening with its header, each page in one tab
      # section with its own title and description), the homepage's twin,
      # sitemap.md against the content, both twins of every moved route, a
      # missing page, the skills, the manifest and the rename map, the MCP
      # card and the absence of a /mcp on the site. The weekly workflow runs the same
      # check against nuxt-backend.dev. With the build's environment, because
      # it reads the build's credentials to know whether the docs assistant
      # should be on (it is, with the OIDC stand-in).
      - name: Check agent surfaces
        if: ${{ !cancelled() }}
        env: *production-shape
        run: node scripts/check-website-agents.mjs

  # Looks at the dependencies a pull request adds or changes, and fails on a
  # known CVE or a package GitHub has flagged as malicious. pnpm's cooldown only
  # delays a new version; it never looks at what is inside it.
  #
  # Pull requests only: the action compares two commits, so there is nothing to
  # compare on a push. It installs nothing, so no code from the PR runs here.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  # The only job that holds the coverage upload credential. It downloads an
  # artifact and installs nothing, so no code from the pull request ever runs
  # beside it.
  coverage:
    needs: test
    # Skipped whenever `test` is, since there would be no artifact to upload.
    # `!cancelled()` on its own is not enough: a skipped `test` would leave this
    # job downloading an artifact that was never produced, and failing for a
    # confusing reason. It does run when tests fail: that is when Codecov's
    # flaky-test detection has something to see.
    if: ${{ !cancelled() && needs.test.result != 'skipped' }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      # Codecov over OIDC, so there is no stored token. It is the only job in
      # this file that holds `id-token: write`, and that is why coverage is its
      # own job: it downloads an artifact and installs nothing, so no code from
      # the pull request ever runs beside the credential.
      id-token: write
    steps:
      # Codecov maps coverage paths onto the repository, so the files have to
      # be here. Nothing is installed and nothing is run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage

      # A run whose tests failed may have written no report.
      - name: Upload coverage reports to Codecov
        if: ${{ hashFiles('coverage/lcov.info') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          slug: qruto/nuxt-backend
          disable_search: true
          files: coverage/lcov.info

      # Run times, failures and flaky-test detection. Runs even when tests
      # fail, which is when it matters.
      #
      # The same action as above with `report_type: test_results`, not
      # `codecov/test-results-action`. That one now prints a deprecation notice
      # telling you to do exactly this, and it still targets Node 20, which the
      # runners are already force-upgrading.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          report_type: test_results
          slug: qruto/nuxt-backend
          disable_search: true
          files: test-report.junit.xml

  # The one required status check, and the only name the branch ruleset knows.
  # Every job above reports into it, so adding, renaming or splitting a job never
  # means editing the ruleset. `skipped` counts as a pass: `dependency-review` is
  # skipped on pushes, and `test`/`pack`/`website` are skipped when no
  # relevant file changed.
  all-checks:
    name: All checks passed
    if: ${{ always() }}
    # `coverage` is deliberately not listed. Codecov is a reporting service,
    # and a third party being down must not block a merge. The coverage
    # thresholds themselves are enforced by vitest inside `test`, which is
    # listed.
    needs:
      - changes
      - static
      - test
      - pack
      - website
      - dependency-review
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check required jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              failure|cancelled)
                echo "::error::A required job did not pass: $result"
                exit 1 ;;
            esac
          done
          echo "All required jobs passed or were skipped."
