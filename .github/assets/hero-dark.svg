<svg xmlns="http://www.w3.org/2000/svg" width="560" height="200" viewBox="0 0 560 200" role="img" aria-label="nuxt-backend — the all-in-one SaaS backend for Nuxt, built on Convex">
  <!-- Dark variant: a gunmetal plate (the site's dark ground and faces), lit from the top-left, with "nuxt-backend" engraved into it and the house mark
       at the left. The type is the site's, outlined as paths so it renders the same wherever GitHub or npm
       shows it: Anybody 700 at wdth 118 and Martian Mono 500, both SIL OFL. Engraving is two stacked
       relief layers under the ink (shade up-left, light down-right), never a filter; the one filter is the
       mark's tritium glow. Regenerate both variants together; README.md shows them through <picture>. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b3f46"/><stop offset="0.5" stop-color="#33373e"/><stop offset="1" stop-color="#2b2e34"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="rgb(255 255 255 / 0.16)"/><stop offset="0.45" stop-color="#fff" stop-opacity="0"/><stop offset="0.6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="rgb(0 0 0 / 0.65)"/></linearGradient>
    <linearGradient id="cast" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#181c24" stop-opacity="0.55"/><stop offset="1" stop-color="#181c24" stop-opacity="0"/></linearGradient>
    <!-- machining grain: hairlines at a 3px / 7px rhythm -->
    <pattern id="grain" width="1" height="21" patternUnits="userSpaceOnUse"><rect y="0" width="1" height="1" fill="#fff" fill-opacity="0.02"/><rect y="3" width="1" height="1" fill="#fff" fill-opacity="0.02"/><rect y="6" width="1" height="1" fill="#fff" fill-opacity="0.02"/><rect y="9" width="1" height="1" fill="#fff" fill-opacity="0.02"/><rect y="12" width="1" height="1" fill="#fff" fill-opacity="0.02"/><rect y="15" width="1" height="1" fill="#fff" fill-opacity="0.02"/><rect y="18" width="1" height="1" fill="#fff" fill-opacity="0.02"/><rect y="1" width="1" height="1" fill="#000" fill-opacity="0.06"/><rect y="8" width="1" height="1" fill="#000" fill-opacity="0.06"/><rect y="15" width="1" height="1" fill="#000" fill-opacity="0.06"/></pattern>
    <linearGradient id="mark-face" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3e46"/><stop offset="1" stop-color="#17191d"/></linearGradient>
    <linearGradient id="mark-rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.4"/><stop offset="0.5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.65"/></linearGradient>
