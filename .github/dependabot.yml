# Dependabot owns every dependency PR here: npm version updates, GitHub Actions
# digest bumps, and CVE fixes (security updates are enabled in the repo's
# Code security settings). Dependabot opens branches and pull requests only;
# like every installed app it can neither push to main nor publish to npm —
# SECURITY.md#installed-apps lists each app and what it may write.
#
# `cooldown` mirrors pnpm's minimumReleaseAge (pnpm-workspace.yaml) but one day
# wider, so Dependabot never proposes a version pnpm will refuse to resolve.
# Keep the exclude list in sync with minimumReleaseAgeExclude there.
# Security updates are exempt from cooldown by design — CVE fixes ship as fast
# as pnpm's own 24h gate allows.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 2
      exclude:
        - nuxt
        - 'nuxt-*'
        - '@nuxt/*'
        - '@nuxtjs/*'
        - convex
        - convex-helpers
        - '@convex-dev/*'
    # `@convex-dev/better-auth` peers `better-auth: ">=1.6.11 <1.7.0"`, and this
    # package mirrors that range for better-auth and its passkey plugin. A 1.7.x
    # bump is a *minor* update, so the all-non-major group below would otherwise
    # propose one that the add-on rejects at install time. Drop both entries
    # when @convex-dev/better-auth ships better-auth 1.7 support (and widen the
    # two ranges in package.json with it).
    #
    # h3 2.x needs Nitro 3, which Nuxt 4 does not run on, and every server
    # handler here is written against h3 1. Drop the entry with the move to
    # Nuxt 5, when Nuxt's own server package moves to h3 2.
    #
    # @polar-sh/sdk 1.x is a rewrite that @convex-dev/polar has not moved to
    # (it still develops against 0.x), and the billing integration shares its
    # types. typescript 7 is beyond typedoc's peer range. The DevTools kit and
    # UI kit move together with Nuxt DevTools' own major, which arrives when
    # Nuxt ships it. Weekly's upstream watch (.github/upstream.json) reports
    # when each of these unblocks, one watch per entry; drop the entry in the
    # pull request that adopts it.
    #
    # @nuxt/fonts 1 (the docs site, #94) serves its faces as Vite build
    # assets under /_nuxt/fonts/. The nuxt-og-image Docus pins (~6.10) fetches
    # them while it prerenders the social cards and gets 404s, so every card
    # falls back to Inter; 1.x also writes metric fallback faces of its own
    # into the stacks app.css names its hand-made fallbacks in. Docus and Nuxt
    # UI still take @nuxt/fonts 0.14 themselves. Drop the entry when Docus
    # moves to nuxt-og-image 7.
    #
    # @vercel/firewall (the docs site's edge rate limits) stays on 1.2.2, the
    # last release with npm provenance: 1.2.3 to 1.2.6 carry none, and pnpm's
    # trustPolicy refuses them at install, which would fail the whole weekly
    # group. It is ignored outright, as no watch can read provenance: the ask
    # in .github/upstream.json ("Publish @vercel/firewall with npm provenance
    # again") tracks it. Drop the entry, and the hand-rolled timeout in
    # website/server/middleware/0.firewall.ts, in the pull request that moves
    # to the first release with provenance again.
    #
    # A major is held with `update-types`, which filters version updates only:
    # a security fix released only in the next major still opens a pull
    # request, and fails CI where the upstream blocker bites, in view. A
    # `versions` range filters security updates too, so it holds only what
    # no update type can name: Better Auth's minor line.
    ignore:
      - dependency-name: better-auth
        versions: ['>=1.7.0']
      - dependency-name: '@better-auth/passkey'
        versions: ['>=1.7.0']
      - dependency-name: h3
        update-types: ['version-update:semver-major']
      - dependency-name: '@polar-sh/sdk'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: '@nuxt/devtools-kit'
        update-types: ['version-update:semver-major']
      - dependency-name: '@nuxt/devtools-ui-kit'
        update-types: ['version-update:semver-major']
      - dependency-name: '@nuxt/fonts'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vercel/firewall'
    # Groups apply only to the kind of update named in `applies-to`, which
    # defaults to version updates. Without the second group every CVE fix
    # opens a pull request of its own.
    groups:
      all-non-major:
        patterns: ['*']
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']
    commit-message:
      prefix: chore
      include: scope

  # The template and the examples: standalone apps with plain ranges and no
  # lockfile (what `create nuxt` hands a user). `increase-if-necessary` only
  # touches a range the newest release has left (a new major), so there is no
  # weekly churn of floors a user's install ignores anyway. `nuxt-backend` is
  # the `latest` dist-tag on purpose, and the component packages and
  # nuxt-convex-module an example imports directly keep the package's own
  # ranges, so they move with it. Same
  # cooldown and exclusions as above.
  - package-ecosystem: npm
    directories:
      - /templates/starter
      - /templates/panels
      - /examples/advanced
    schedule:
      interval: weekly
      day: monday
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 2
      exclude:
        - nuxt
        - 'nuxt-*'
        - '@nuxt/*'
        - '@nuxtjs/*'
        - convex
        - convex-helpers
        - '@convex-dev/*'
    ignore:
      - dependency-name: nuxt-backend
      - dependency-name: '@convex-dev/*'
      - dependency-name: nuxt-convex-module
    groups:
      templates:
        patterns: ['*']
    commit-message:
      prefix: chore
      include: scope

  # Actions digest bumps — keeps the `@<sha> # vX.Y.Z` pinning convention
  # intact. Native workflow-file writes: no PAT, no GitHub App. The composite
  # action's own pins are not found from `/`, hence the second directory.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 2
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
      include: scope
