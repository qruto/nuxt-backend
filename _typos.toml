# typos (https://github.com/crate-ci/typos) finds misspellings in prose,
# comments, identifiers and workflow files. It is a spell checker for source
# code, not a style linter — it only reports words with one obvious correction.

[files]
# typos honours .gitignore, which is not enough here. CI checks out with
# `fetch-depth: 0`, so without this it walks into `.git/` and reports on packed
# objects and old commit subjects — findings nobody can fix, turning up at
# random as the history grows.
extend-exclude = [
  ".git/",
  # Generated or vendored, and not ours to correct.
  "pnpm-lock.yaml",
  "CHANGELOG.md",
  "website/content/docs/10.reference/10.api/**",
  "**/_generated/**",
  "**/billing.generated.ts",
  "skills-lock.json",
  # Scanner workspaces (gitignored) and vendored AI tooling: .agents/ and
  # .claude/ hold third-party skills committed as-is, whose wording is theirs.
  ".deepsec/",
  ".agents/",
  ".claude/",
  ".fallow/",
  ".qa/",
]

[default.extend-words]
# `wdth` — the OpenType width-axis tag (nuxt.config.ts `fonts`, Google's css2 URLs).
wdth = "wdth"
# `mis-group` — a hyphenated prefix, not a truncated "miss" (the tailwind-merge
# notes in the website).
mis = "mis"
# Both spellings are standard; "unparseable" is the one TypeScript's own
# diagnostics use.
unparseable = "unparseable"
# `activePendings` — the plural of the `pendingSpends` entries, not "pending".
Pendings = "Pendings"
