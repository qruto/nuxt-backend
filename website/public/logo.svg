<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-labelledby="nb-title">
  <title id="nb-title">Nuxt backend</title>
  <!-- The coin: a round matte titanium plaque with the stack glyph engraved into it and one green status LED.
       Follows the OS colour scheme (prefers-color-scheme) — use logo-light.svg / logo-dark.svg for an explicit variant. -->
  <defs>
    <!-- Coin side: a bevel lit from the top-left, dark at the bottom-right. -->
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop class="e0" offset="0" stop-color="#ffffff"/>
      <stop class="e1" offset="0.55" stop-color="#bdbdbd"/>
      <stop class="e2" offset="1" stop-color="#8d8d8d"/>
    </linearGradient>
    <!-- Face: matte titanium, one light ray from the top-left. -->
    <radialGradient id="face" cx="0.34" cy="0.30" r="0.86">
      <stop class="f0" offset="0" stop-color="#fdfdfd"/>
      <stop class="f1" offset="0.5" stop-color="#ececec"/>
      <stop class="f2" offset="1" stop-color="#d2d2d2"/>
    </radialGradient>
    <!-- 1px rim: lit top-left, shadowed bottom-right. -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop class="r0" offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop class="r3" offset="1" stop-color="#000000" stop-opacity="0.28"/>
    </linearGradient>
    <!-- Machining grain: sub-unit hairlines — crisp at 256px+, averaging to a tint at icon sizes. -->
    <pattern id="grain" width="0.6" height="2.1" patternUnits="userSpaceOnUse">
      <rect class="g0" width="0.6" height="0.3" fill="#ffffff" fill-opacity="0.22"/>
      <rect class="g1" y="1.2" width="0.6" height="0.3" fill="#000000" fill-opacity="0.05"/>
    </pattern>
    <!-- The stack glyph: many backend services unified into one stack. -->
    <g id="stack">
      <path d="M50 20 82 38 50 56 18 38Z" stroke="none"/>
      <path d="M18 50 50 68 82 50" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
      <path d="M18 62 50 80 82 62" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
    </g>
  </defs>
  <style>
    @media (prefers-color-scheme: dark) {
      .e0 { stop-color: #5c5c5c; } .e1 { stop-color: #2a2a2a; } .e2 { stop-color: #090909; }
      .f0 { stop-color: #343434; } .f1 { stop-color: #262626; } .f2 { stop-color: #171717; }
      .r0 { stop-opacity: 0.32; } .r3 { stop-opacity: 0.60; }
      .g0 { fill-opacity: 0.06; } .g1 { fill-opacity: 0.16; }
      .cdw { fill-opacity: 0.22; stroke-opacity: 0.22; }
      .clw { fill-opacity: 0.05; stroke-opacity: 0.05; }
      .cd { fill-opacity: 0.85; stroke-opacity: 0.85; }
      .cl { fill-opacity: 0.16; stroke-opacity: 0.16; }
      .ink { fill: #7a7a7a; stroke: #7a7a7a; }
      .socket { fill-opacity: 0.55; } .glow { fill-opacity: 0.32; }
      .led { fill: #49b567; } .core { fill: #afe8c0; }
    }
  </style>
  <!-- Coin body -->
  <circle cx="50" cy="50" r="48" fill="url(#edge)"/>
  <circle cx="50" cy="50" r="46.4" fill="url(#face)"/>
  <circle cx="50" cy="50" r="46.4" fill="url(#grain)"/>
  <circle cx="50" cy="50" r="45.9" fill="none" stroke="url(#rim)" stroke-width="1"/>
  <!-- Engraved glyph: offset copies under the base shape — dark up-left (the cut's shadowed wall),
       light down-right (its lit lip); a wide + a tight layer per side. No SVG filters. -->
  <use href="#stack" class="cdw" transform="translate(-2.2 -3.2) translate(50 49) scale(0.8) translate(-50 -50)" fill="#000" stroke="#000" fill-opacity="0.08" stroke-opacity="0.08"/>
  <use href="#stack" class="clw" transform="translate(2 3) translate(50 49) scale(0.8) translate(-50 -50)" fill="#fff" stroke="#fff" fill-opacity="0.35" stroke-opacity="0.35"/>
  <use href="#stack" class="cd" transform="translate(-1 -1.4) translate(50 49) scale(0.8) translate(-50 -50)" fill="#000" stroke="#000" fill-opacity="0.40" stroke-opacity="0.40"/>
  <use href="#stack" class="cl" transform="translate(1 1.6) translate(50 49) scale(0.8) translate(-50 -50)" fill="#fff" stroke="#fff" fill-opacity="0.92" stroke-opacity="0.92"/>
  <use href="#stack" class="ink" transform="translate(50 49) scale(0.8) translate(-50 -50)" fill="#7c7c7c" stroke="#7c7c7c"/>
  <!-- Status LED in a milled socket — the only chroma; never engraved. -->
  <circle class="socket" cx="74" cy="74" r="5.4" fill="#000" fill-opacity="0.16"/>
  <circle class="glow" cx="74" cy="74" r="7.6" fill="#49b567" fill-opacity="0.26"/>
  <circle class="led" cx="74" cy="74" r="3.7" fill="#136d36"/>
  <circle class="core" cx="72.9" cy="72.9" r="1.25" fill="#7dd296" fill-opacity="0.9"/>
</svg>
